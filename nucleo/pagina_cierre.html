/* ── v37-i18n (V36-7) — CAMBIAR DE IDIOMA SIN VOLVER AL CONSTRUCTOR ──
   Lo que reportó Darío: con el MIRROR en inglés, hablar en castellano se transcribía
   mal («See Puffer, Cura y Cartesiano») y NO había forma de cambiar el idioma sin
   volver al constructor. Además el micrófono quedaba «pegado»: `recog.lang` se fija
   al CREAR el reconocedor, así que cambiar el idioma no servía hasta recargar.
   ARREGLO: switch accesible (botón del pie y por voz) que aplica en el acto Y
   REINICIA el reconocedor, para que el dictado tome el idioma nuevo enseguida. */
window.i18nCambiar = function(l){
  try {
    if (l!=='es' && l!=='en' && l!=='pt') return false;
    window.i18nSel = l;
    try { if (typeof CONFIG!=='undefined' && CONFIG){ CONFIG.idioma = l; if (typeof guardarConfig==='function') guardarConfig(CONFIG); } } catch(e){}
    try { window.i18nAplicarUI(); } catch(e){}
    // El reconocedor guarda el idioma de cuando nació: hay que rehacerlo.
    try {
      const estaba = (typeof micOn!=='undefined' && micOn);
      if (estaba && typeof micStop==='function') micStop();
      if (typeof recog!=='undefined' && recog){ try{ recog.abort(); }catch(e){} recog = null; }
      if (estaba && typeof toggleMic==='function') setTimeout(function(){ try{ toggleMic(); }catch(e){} }, 250);
    } catch(e){}
    // Las voces disponibles también dependen del idioma elegido.
    try { if (typeof cargarVoces==='function') cargarVoces(); } catch(e){}
    return true;
  } catch(e){ try{ regError('i18n:cambiar', e); }catch(_){ } return false; }
};

    const nuevo = orden[(i<0?0:i+1) % orden.length];
    window.i18nCambiar(nuevo);
    try { const b=document.getElementById('idiBtn'); if(b) b.textContent = '🌐 '+nuevo.toUpperCase(); } catch(e){}
    try { if (typeof addMsg==='function') addMsg('mirror', ({es:'Listo, sigo en español ✅ — el dictado también.',en:'Done, switching to English ✅ — dictation too.',pt:'Pronto, sigo em português ✅ — o ditado também.'})[nuevo], mode); } catch(e){}
    return nuevo;
  } catch(e){ return ''; }
};
window.i18nVozPrefijo = function(){ return ({es:'es',en:'en',pt:'pt'})[window.i18nActual()]||'es'; };
function trNodo(n,l){
  var orig = I18N_WM.has(n) ? I18N_WM.get(n) : n.nodeValue;
  var key = String(orig).replace(/\s+/g,' ').trim();
  if(!key) return;
  var e = I18N_DICT[key];
  if(!e) return;
  if(!I18N_WM.has(n)) I18N_WM.set(n, orig);
  var m = String(orig).match(/^(\s*)[\s\S]*?(\s*)$/);
  n.nodeValue = m[1] + ((l==='es') ? String(orig).trim() : (e[l]!==undefined ? e[l] : String(orig).trim())) + m[2];
}
function trAttrs(root,l){
  try{
    var els = root.querySelectorAll('[placeholder],[title]');
    for(var i=0;i<els.length;i++){
      var el = els[i];
      ['placeholder','title'].forEach(function(a){
        try{
          var v = el.getAttribute(a); if(v===null) return;
          var dk = 'i18nEs'+a;
          if(!el.dataset[dk]){ if(!I18N_DICT[String(v).replace(/\s+/g,' ').trim()]) return; el.dataset[dk]=v; }
          var es = el.dataset[dk];
          var e = I18N_DICT[String(es).replace(/\s+/g,' ').trim()];
          el.setAttribute(a, (l==='es') ? es : ((e&&e[l])||es));
        }catch(e2){}
      });
    }
  }catch(e){}
}
window.i18nConsTraducir = function(){
  try{
    var ov = document.getElementById('cons-ov'); if(!ov) return;
    var l = window.i18nActual();
    var w = document.createTreeWalker(ov, NodeFilter.SHOW_TEXT, null, false);
    var n; while((n = w.nextNode())) trNodo(n, l);
    trAttrs(ov, l);
  }catch(e){ try{ regError('i18n:cons', e) }catch(e2){} }
};
window.i18nAplicarUI = function(){
  try{
    var l = window.i18nActual();
    trAttrs(document.body, l);
    var mic = document.getElementById('micbtn'); if(mic) mic.title = window.i18nT('Dictar por voz')+' ('+window.i18nRecLang()+')';
    if (typeof cargarVoces==='function') try{ cargarVoces(); }catch(e3){}
  }catch(e){ try{ regError('i18n:ui', e) }catch(e2){} }
};
window.i18nConsCambiar = function(v){
  try{ window.i18nSel = (v==='en'||v==='pt'||v==='es') ? v : 'es'; window.i18nConsTraducir(); window.i18nAplicarUI(); }
  catch(e){ try{ regError('i18n:cambiar', e) }catch(e2){} }
};
// ganchos: cada paso repinta contenido dinámico (toggles/perillas/motores) → retraducir
if (typeof window.consGo==='function'){ var _cg=window.consGo; window.consGo=function(n){ _cg(n); try{ window.i18nConsTraducir(); }catch(e){} }; }
if (typeof window.abrirConstructor==='function'){ var _ac=window.abrirConstructor; window.abrirConstructor=function(){ _ac(); try{ var s=document.getElementById('c-idioma'); if(s) s.value=window.i18nActual(); window.i18nConsTraducir(); }catch(e){} }; }
// arranque: usuario configurado con idioma ≠ es → interfaz coherente al abrir; con es o sin idioma → cero cambios
try{ if (window.i18nActual()!=='es'){ window.i18nAplicarUI(); window.i18nConsTraducir(); } }catch(e){}
// v37-i18n (V36-7): el botón del pie nace mostrando el idioma real
try{ var _ib=document.getElementById('idiBtn'); if(_ib) _ib.textContent='🌐 '+window.i18nActual().toUpperCase(); }catch(e){}
}catch(e){ try{ regError('i18n:init', e) }catch(e2){} }
})();
</script>
